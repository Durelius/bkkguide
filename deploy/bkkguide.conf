# Apache vhost for The BKK Guide. Install as /etc/httpd/conf.d/bkkguide.conf, then:
#   sudo apachectl configtest && sudo systemctl reload httpd
#   sudo certbot --apache -d bkkguide.wilhelm.my
# certbot adds the HTTPS redirect here and writes bkkguide-le-ssl.conf.

<VirtualHost *:80>
    ServerName bkkguide.wilhelm.my
    ServerAdmin wilhelm@durelius.se

    ErrorLog logs/bkkguide-error_log
    CustomLog logs/bkkguide-access_log common

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8097/
    ProxyPassReverse / http://127.0.0.1:8097/

    RequestHeader set X-Forwarded-Proto "https"
    # Photo uploads are up to 25 MB.
    LimitRequestBody 27262976
</VirtualHost>
